[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "scattering-ai-sdk"
dynamic = ["version"]
description = "AI SDK for scattering science: domain-grounded reasoning for RMC, PDF, diffraction, phonon, and diffuse-scattering workflows"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Tsung-Han Yang" }]
keywords = ["scattering", "neutron", "x-ray", "RMC", "PDF", "diffraction", "AI", "LLM", "agents"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Chemistry",
]
dependencies = [
    "pydantic>=2.0",
    "numpy>=1.24",
    "scipy>=1.10",
]

[project.optional-dependencies]
llm = ["openai>=1.0"]
volumes = ["h5py>=3.8"]
dev = ["pytest>=8.0", "ruff>=0.4"]

[project.urls]
Repository = "https://github.com/thyang/scattering-ai-sdk"

[project.scripts]
scattering-ai = "scattering_ai.cli:main"

[tool.hatch.version]
path = "src/scattering_ai/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/scattering_ai"]

[tool.hatch.build.targets.wheel.force-include]
"knowledge" = "scattering_ai/knowledge"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
